<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCTV Billboard Hijack // Live Stream Projection Map</title>
  <style>
    :root {
      --phosphor-cyan: #00f0ff;
      --phosphor-pink: #ff0055;
      --bg-dark: #07090d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: var(--bg-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', Courier, monospace;
      color: #9ab4c2;
      overflow-x: hidden;
      padding: 16px;
    }

    .cctv-stage {
      position: relative;
      width: 100%;
      max-width: 1050px;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.95), 0 0 0 2px #1c2630;
    }

    /* LAYER 1: Genuine 24/7 Live YouTube CCTV Stream Background */
    .cctv-live-iframe {
      position: absolute;
      top: -12%;
      left: -10%;
      width: 120%;
      height: 124%;
      border: none;
      pointer-events: none; /* Allows click through to video & controls */
      z-index: 1;
      filter: contrast(1.05) brightness(0.95);
    }

    /* LAYER 2: 3D Perspective Billboard Projection Surface */
    .billboard-3d-quad {
      position: absolute;
      top: 18%;
      left: 54%;
      width: 32%;
      height: 38%;
      z-index: 5;
      perspective: 900px;
      transform-style: preserve-3d;
      pointer-events: none;
    }

    .billboard-video-surface {
      width: 100%;
      height: 100%;
      transform: rotateY(-32deg) rotateX(12deg) skewY(-5deg) scale(0.96);
      transform-origin: left center;
      border: 2px solid #000;
      box-shadow: 
        0 0 35px rgba(0, 240, 255, 0.45),
        inset 0 0 20px rgba(0, 0, 0, 0.95);
      background: #000;
      overflow: hidden;
      position: relative;
    }

    .billboard-video-surface video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: contrast(1.18) saturate(1.28) brightness(1.12);
      z-index: 1;
    }

    /* Outdoor Jumbotron LED Matrix & Specular Glare */
    .jumbotron-led-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle, rgba(0, 0, 0, 0) 60%, rgba(0, 0, 0, 0.65) 100%),
        repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.28) 0px, rgba(0, 0, 0, 0.28) 2px, transparent 2px, transparent 4px),
        repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.28) 0px, rgba(0, 0, 0, 0.28) 2px, transparent 2px, transparent 4px);
      background-size: 100% 100%, 4px 4px, 4px 4px;
      mix-blend-mode: multiply;
      pointer-events: none;
      z-index: 4;
    }

    .billboard-bloom {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 40%, rgba(0,240,255,0.18) 100%);
      mix-blend-mode: screen;
      pointer-events: none;
      z-index: 5;
    }

    /* Security Camera HUD Overlay */
    .cctv-hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
      font-size: 11px;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 0 6px rgba(0,0,0,0.95);
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .rec-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: bold;
      color: #ff3b30;
    }
    .rec-dot {
      width: 8px;
      height: 8px;
      background: #ff3b30;
      border-radius: 50%;
      animation: blink 1.2s infinite;
      box-shadow: 0 0 8px #ff3b30;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

    .crosshair-target {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      border: 1px dashed rgba(255, 255, 255, 0.35);
      pointer-events: none;
      z-index: 10;
    }

    .hud-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    /* Calibration Deck */
    .control-deck {
      margin-top: 18px;
      width: 100%;
      max-width: 1050px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: center;
      background: #0d1217;
      padding: 14px 20px;
      border-radius: 8px;
      border: 1px solid #1f2b37;
    }

    .sliders-grid {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .slider-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 10px;
      color: #8da4b3;
    }

    .slider-item input {
      accent-color: var(--phosphor-cyan);
      cursor: pointer;
    }

    .deck-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-action {
      background: #15222e;
      border: 1px solid var(--phosphor-cyan);
      color: var(--phosphor-cyan);
      font-family: inherit;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1.2px;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      background: var(--phosphor-cyan);
      color: #000;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }
  </style>
</head>
<body>

  <div class="cctv-stage" id="cctvStage">
    
    <!-- Real Live 24/7 CCTV Feed (Default: Times Square / Shibuya) -->
    <iframe 
      id="cctvIframe"
      class="cctv-live-iframe"
      src="https://www.youtube.com/embed/JQ_jwk_7OVE?autoplay=1&mute=1&controls=0&showinfo=0&rel=0&loop=1&playlist=JQ_jwk_7OVE&playsinline=1"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>

    <!-- 3D Perspective Billboard Surface (Live Video Hijack Overlay) -->
    <div class="billboard-3d-quad" id="billboardQuad">
      <div class="billboard-video-surface" id="billboardSurface">
        
        <video 
          id="hijackVideo" 
          playsinline 
          loop 
          muted 
          autoplay 
          preload="auto">
          <source src="paludarium_stream.mp4" type="video/mp4">
          <source src="https://paludarium.tallkidd.com/paludarium_stream.mp4" type="video/mp4">
        </video>

        <div class="jumbotron-led-grid"></div>
        <div class="billboard-bloom"></div>

      </div>
    </div>

    <div class="crosshair-target"></div>

    <div class="cctv-hud">
      <div class="hud-top">
        <div class="rec-indicator">
          <div class="rec-dot"></div>
          <span id="camLabel">LIVE CCTV [NYC-CAM-01] // TIMES SQ. NORTH</span>
        </div>
        <div id="timeHud">00:00:00 UTC</div>
      </div>

      <div class="hud-bottom">
        <div>
          LAT: 40.7580° N | LON: 73.9855° W<br>
          TARGET: TIMES SQ. TOWER DISPLAY
        </div>
        <div style="color: var(--phosphor-cyan);">
          PROJECTION: <span style="font-weight:bold;">LIVE OVERLAY ACTIVE</span>
        </div>
      </div>
    </div>

  </div>

  <!-- Calibration Controls -->
  <div class="control-deck">
    <div class="sliders-grid">
      <div class="slider-item">
        <span>YAW (Rotate Y): <strong id="valY">-32°</strong></span>
        <input type="range" id="rotY" min="-80" max="80" value="-32">
      </div>
      <div class="slider-item">
        <span>PITCH (Rotate X): <strong id="valX">12°</strong></span>
        <input type="range" id="rotX" min="-50" max="50" value="12">
      </div>
      <div class="slider-item">
        <span>SKEW (Vertical): <strong id="valSkew">-5°</strong></span>
        <input type="range" id="skewY" min="-30" max="30" value="-5">
      </div>
      <div class="slider-item">
        <span>POS X: <strong id="valXPos">54%</strong></span>
        <input type="range" id="posX" min="0" max="80" value="54">
      </div>
      <div class="slider-item">
        <span>POS Y: <strong id="valYPos">18%</strong></span>
        <input type="range" id="posY" min="0" max="80" value="18">
      </div>
      <div class="slider-item">
        <span>SCALE: <strong id="valScale">0.96</strong></span>
        <input type="range" id="scaleVal" min="0.4" max="1.6" step="0.02" value="0.96">
      </div>
    </div>

    <div class="deck-buttons">
      <button class="btn-action" id="camSwitch">SWITCH CAM</button>
      <button class="btn-action" id="audioToggle">AUDIO</button>
      <button class="btn-action" id="resetAngles">RESET</button>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('timeHud').innerText = 
        now.toISOString().replace('T', ' ').substring(0, 19) + ' EDT';
    }
    setInterval(updateClock, 1000);
    updateClock();

    const video = document.getElementById('hijackVideo');
    const audioToggle = document.getElementById('audioToggle');
    const stage = document.getElementById('cctvStage');

    function startPlayback() {
      video.play().catch(err => console.log("Autoplay click needed:", err));
    }
    startPlayback();

    function toggleAudio() {
      video.muted = !video.muted;
      audioToggle.innerText = video.muted ? "AUDIO: MUTED" : "AUDIO: ON";
      audioToggle.style.background = video.muted ? "#15222e" : "var(--phosphor-cyan)";
      audioToggle.style.color = video.muted ? "var(--phosphor-cyan)" : "#000";
    }

    audioToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleAudio();
    });
    stage.addEventListener('click', () => {
      startPlayback();
      toggleAudio();
    });

    // Camera Switcher (Times Square <-> Shibuya Crossing)
    let currentCam = 0;
    const cams = [
      {
        id: "JQ_jwk_7OVE",
        label: "LIVE CCTV [NYC-CAM-01] // TIMES SQ. NORTH",
        rotY: -32, rotX: 12, skewY: -5, x: 54, y: 18, scale: 0.96
      },
      {
        id: "8H3nRCFVR6Y",
        label: "LIVE CCTV [TOKYO-CAM-03] // SHIBUYA CROSSING",
        rotY: -18, rotX: 8, skewY: -3, x: 50, y: 22, scale: 0.88
      }
    ];

    const cctvIframe = document.getElementById('cctvIframe');
    const camLabel = document.getElementById('camLabel');
    const camSwitch = document.getElementById('camSwitch');

    camSwitch.addEventListener('click', () => {
      currentCam = (currentCam + 1) % cams.length;
      const cam = cams[currentCam];
      cctvIframe.src = `https://www.youtube.com/embed/${cam.id}?autoplay=1&mute=1&controls=0&showinfo=0&rel=0&loop=1&playlist=${cam.id}&playsinline=1`;
      camLabel.innerText = cam.label;

      rotY.value = cam.rotY;
      rotX.value = cam.rotX;
      skewY.value = cam.skewY;
      posX.value = cam.x;
      posY.value = cam.y;
      scaleVal.value = cam.scale;
      updatePerspective();
    });

    // Perspective & Placement Controls
    const quad = document.getElementById('billboardQuad');
    const surface = document.getElementById('billboardSurface');
    const rotY = document.getElementById('rotY');
    const rotX = document.getElementById('rotX');
    const skewY = document.getElementById('skewY');
    const posX = document.getElementById('posX');
    const posY = document.getElementById('posY');
    const scaleVal = document.getElementById('scaleVal');

    const valY = document.getElementById('valY');
    const valX = document.getElementById('valX');
    const valSkew = document.getElementById('valSkew');
    const valXPos = document.getElementById('valXPos');
    const valYPos = document.getElementById('valYPos');
    const valScale = document.getElementById('valScale');

    function updatePerspective() {
      valY.innerText = rotY.value + '°';
      valX.innerText = rotX.value + '°';
      valSkew.innerText = skewY.value + '°';
      valXPos.innerText = posX.value + '%';
      valYPos.innerText = posY.value + '%';
      valScale.innerText = scaleVal.value;

      quad.style.left = posX.value + '%';
      quad.style.top = posY.value + '%';
      surface.style.transform = `rotateY(${rotY.value}deg) rotateX(${rotX.value}deg) skewY(${skewY.value}deg) scale(${scaleVal.value})`;
    }

    rotY.addEventListener('input', updatePerspective);
    rotX.addEventListener('input', updatePerspective);
    skewY.addEventListener('input', updatePerspective);
    posX.addEventListener('input', updatePerspective);
    posY.addEventListener('input', updatePerspective);
    scaleVal.addEventListener('input', updatePerspective);

    document.getElementById('resetAngles').addEventListener('click', () => {
      const cam = cams[currentCam];
      rotY.value = cam.rotY;
      rotX.value = cam.rotX;
      skewY.value = cam.skewY;
      posX.value = cam.x;
      posY.value = cam.y;
      scaleVal.value = cam.scale;
      updatePerspective();
    });
  </script>
</body>
</html>
