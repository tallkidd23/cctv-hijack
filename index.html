<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCTV Billboard Hijack // Interactive Projection Map</title>
  <style>
    :root {
      --phosphor-cyan: #00f0ff;
      --phosphor-pink: #ff0055;
      --bg-dark: #07090d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: var(--bg-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', Courier, monospace;
      color: #9ab4c2;
      overflow-x: hidden;
      padding: 16px;
    }

    .cctv-stage {
      position: relative;
      width: 100%;
      max-width: 1050px;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.95), 0 0 0 2px #1c2630;
      cursor: pointer;
    }

    #cctvBaseCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .billboard-3d-quad {
      position: absolute;
      top: 14%;
      left: 48%;
      width: 38%;
      height: 48%;
      z-index: 2;
      perspective: 800px;
      transform-style: preserve-3d;
      pointer-events: none;
    }

    .billboard-video-surface {
      width: 100%;
      height: 100%;
      transform: rotateY(-36deg) rotateX(10deg) skewY(-6deg) scale(0.96);
      transform-origin: left center;
      border: 3px solid #111;
      box-shadow: 
        0 0 30px rgba(0, 240, 255, 0.35),
        inset 0 0 20px rgba(0, 0, 0, 0.9);
      background: #05080c;
      overflow: hidden;
      position: relative;
    }

    .billboard-video-surface video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: contrast(1.15) saturate(1.25) brightness(1.1);
      z-index: 1;
    }

    .jumbotron-led-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle, rgba(0, 0, 0, 0) 60%, rgba(0, 0, 0, 0.65) 100%),
        repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.25) 0px, rgba(0, 0, 0, 0.25) 2px, transparent 2px, transparent 4px),
        repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.25) 0px, rgba(0, 0, 0, 0.25) 2px, transparent 2px, transparent 4px);
      background-size: 100% 100%, 4px 4px, 4px 4px;
      mix-blend-mode: multiply;
      pointer-events: none;
      z-index: 4;
    }

    .billboard-bloom {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(255,255,255,0.18) 0%, transparent 40%, rgba(0,240,255,0.15) 100%);
      mix-blend-mode: screen;
      pointer-events: none;
      z-index: 5;
    }

    .cctv-hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
      font-size: 11px;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 0 4px rgba(0,0,0,0.9);
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .rec-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: bold;
      color: #ff3b30;
    }
    .rec-dot {
      width: 8px;
      height: 8px;
      background: #ff3b30;
      border-radius: 50%;
      animation: blink 1.2s infinite;
      box-shadow: 0 0 8px #ff3b30;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

    .crosshair-target {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      border: 1px dashed rgba(255, 255, 255, 0.2);
      pointer-events: none;
    }

    .hud-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .control-deck {
      margin-top: 18px;
      width: 100%;
      max-width: 1050px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: center;
      background: #0d1217;
      padding: 14px 20px;
      border-radius: 8px;
      border: 1px solid #1f2b37;
    }

    .sliders-grid {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }

    .slider-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 10px;
      color: #8da4b3;
    }

    .slider-item input {
      accent-color: var(--phosphor-cyan);
      cursor: pointer;
    }

    .deck-buttons {
      display: flex;
      gap: 10px;
    }

    .btn-action {
      background: #15222e;
      border: 1px solid var(--phosphor-cyan);
      color: var(--phosphor-cyan);
      font-family: inherit;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1.5px;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      background: var(--phosphor-cyan);
      color: #000;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
    }
  </style>
</head>
<body>

  <div class="cctv-stage" id="cctvStage" title="Click to start video with sound">
    <canvas id="cctvBaseCanvas"></canvas>

    <div class="billboard-3d-quad" id="billboardQuad">
      <div class="billboard-video-surface" id="billboardSurface">
        
        <video 
          id="hijackVideo" 
          playsinline 
          loop 
          muted 
          autoplay 
          preload="auto">
          <source src="paludarium_stream.mp4" type="video/mp4">
          <source src="https://paludarium.tallkidd.com/paludarium_stream.mp4" type="video/mp4">
        </video>

        <canvas id="billboardFallbackCanvas" style="position:absolute; top:0; left:0; width:100%; height:100%; z-index:0;"></canvas>

        <div class="jumbotron-led-grid"></div>
        <div class="billboard-bloom"></div>

      </div>
    </div>

    <div class="crosshair-target"></div>

    <div class="cctv-hud">
      <div class="hud-top">
        <div class="rec-indicator">
          <div class="rec-dot"></div>
          <span>LIVE CCTV [CAM-07] // TIMES SQ. NORTH</span>
        </div>
        <div id="timeHud">00:00:00 UTC</div>
      </div>

      <div class="hud-bottom">
        <div>
          LAT: 40.7580° N | LON: 73.9855° W<br>
          TARGET: JUMBOTRON AD-ARRAY #4
        </div>
        <div style="color: var(--phosphor-cyan);">
          HIJACK STATUS: <span style="font-weight:bold;" id="hijackStatusText">SIGNAL ACTIVE</span>
        </div>
      </div>
    </div>

  </div>

  <div class="control-deck">
    <div class="sliders-grid">
      <div class="slider-item">
        <span>YAW (Rotate Y): <strong id="valY">-36°</strong></span>
        <input type="range" id="rotY" min="-80" max="80" value="-36">
      </div>
      <div class="slider-item">
        <span>PITCH (Rotate X): <strong id="valX">10°</strong></span>
        <input type="range" id="rotX" min="-50" max="50" value="10">
      </div>
      <div class="slider-item">
        <span>SKEW (Vertical): <strong id="valSkew">-6°</strong></span>
        <input type="range" id="skewY" min="-30" max="30" value="-6">
      </div>
      <div class="slider-item">
        <span>SCALE: <strong id="valScale">0.96</strong></span>
        <input type="range" id="scaleVal" min="0.5" max="1.5" step="0.02" value="0.96">
      </div>
    </div>

    <div class="deck-buttons">
      <button class="btn-action" id="audioToggle">AUDIO: MUTED</button>
      <button class="btn-action" id="resetAngles">RESET</button>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('timeHud').innerText = 
        now.toISOString().replace('T', ' ').substring(0, 19) + ' EDT';
    }
    setInterval(updateClock, 1000);
    updateClock();

    const canvas = document.getElementById('cctvBaseCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let traffic = Array.from({ length: 18 }, () => ({
      x: Math.random() * 800,
      y: 320 + Math.random() * 150,
      speed: 2 + Math.random() * 4,
      color: Math.random() > 0.5 ? '#ff3b30' : '#ffe066',
      size: Math.random() * 3 + 2
    }));

    function drawCityCCTV() {
      ctx.fillStyle = '#0a0e14';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#06080b';
      ctx.fillRect(40, 80, 180, canvas.height);
      ctx.fillRect(260, 40, 200, canvas.height);
      
      ctx.fillStyle = '#0e151e';
      ctx.beginPath();
      ctx.moveTo(canvas.width * 0.46, canvas.height * 0.12);
      ctx.lineTo(canvas.width * 0.88, canvas.height * 0.18);
      ctx.lineTo(canvas.width * 0.88, canvas.height * 0.68);
      ctx.lineTo(canvas.width * 0.46, canvas.height * 0.64);
      ctx.fill();

      ctx.fillStyle = 'rgba(255, 230, 150, 0.15)';
      for (let i = 0; i < 20; i++) {
        for (let j = 0; j < 8; j++) {
          if ((i + j) % 3 === 0) {
            ctx.fillRect(60 + j * 18, 100 + i * 20, 10, 12);
          }
        }
      }

      ctx.fillStyle = '#040608';
      ctx.fillRect(0, canvas.height * 0.72, canvas.width, canvas.height * 0.28);

      traffic.forEach(car => {
        car.x += car.speed;
        if (car.x > canvas.width + 20) car.x = -20;
        ctx.fillStyle = car.color;
        ctx.shadowColor = car.color;
        ctx.shadowBlur = 8;
        ctx.fillRect(car.x, car.y, car.size * 2, car.size);
        ctx.shadowBlur = 0;
      });

      ctx.fillStyle = 'rgba(255, 255, 255, 0.015)';
      for (let k = 0; k < 6; k++) {
        const lineY = Math.random() * canvas.height;
        ctx.fillRect(0, lineY, canvas.width, 1.5);
      }

      requestAnimationFrame(drawCityCCTV);
    }
    drawCityCCTV();

    const fbCanvas = document.getElementById('billboardFallbackCanvas');
    const fbCtx = fbCanvas.getContext('2d');
    let angle = 0;

    function drawFallback() {
      fbCanvas.width = fbCanvas.parentElement.clientWidth;
      fbCanvas.height = fbCanvas.parentElement.clientHeight;
      
      fbCtx.fillStyle = '#03080e';
      fbCtx.fillRect(0, 0, fbCanvas.width, fbCanvas.height);

      angle += 0.03;
      fbCtx.strokeStyle = '#00f0ff';
      fbCtx.lineWidth = 3;
      fbCtx.beginPath();
      for (let x = 0; x < fbCanvas.width; x += 10) {
        let y = fbCanvas.height / 2 + Math.sin(x * 0.05 + angle) * 25;
        if (x === 0) fbCtx.moveTo(x, y);
        else fbCtx.lineTo(x, y);
      }
      fbCtx.stroke();

      fbCtx.fillStyle = '#ff0055';
      fbCtx.font = 'bold 16px monospace';
      fbCtx.fillText('LIVE STREAM FEED', 20, 40);

      requestAnimationFrame(drawFallback);
    }
    drawFallback();

    const video = document.getElementById('hijackVideo');
    const audioToggle = document.getElementById('audioToggle');
    const stage = document.getElementById('cctvStage');

    function startPlayback() {
      video.play().then(() => {
        document.getElementById('hijackStatusText').innerText = "STREAM ONLINE";
      }).catch(err => {
        console.log("Autoplay waiting for click:", err);
      });
    }
    startPlayback();

    function toggleAudio() {
      video.muted = !video.muted;
      audioToggle.innerText = video.muted ? "AUDIO: MUTED" : "AUDIO: ON";
      audioToggle.style.background = video.muted ? "#15222e" : "var(--phosphor-cyan)";
      audioToggle.style.color = video.muted ? "var(--phosphor-cyan)" : "#000";
    }

    audioToggle.addEventListener('click', toggleAudio);
    stage.addEventListener('click', () => {
      startPlayback();
      toggleAudio();
    });

    const surface = document.getElementById('billboardSurface');
    const rotY = document.getElementById('rotY');
    const rotX = document.getElementById('rotX');
    const skewY = document.getElementById('skewY');
    const scaleVal = document.getElementById('scaleVal');

    const valY = document.getElementById('valY');
    const valX = document.getElementById('valX');
    const valSkew = document.getElementById('valSkew');
    const valScale = document.getElementById('valScale');

    function updatePerspective() {
      valY.innerText = rotY.value + '°';
      valX.innerText = rotX.value + '°';
      valSkew.innerText = skewY.value + '°';
      valScale.innerText = scaleVal.value;

      surface.style.transform = `rotateY(${rotY.value}deg) rotateX(${rotX.value}deg) skewY(${skewY.value}deg) scale(${scaleVal.value})`;
    }

    rotY.addEventListener('input', updatePerspective);
    rotX.addEventListener('input', updatePerspective);
    skewY.addEventListener('input', updatePerspective);
    scaleVal.addEventListener('input', updatePerspective);

    document.getElementById('resetAngles').addEventListener('click', () => {
      rotY.value = -36;
      rotX.value = 10;
      skewY.value = -6;
      scaleVal.value = 0.96;
      updatePerspective();
    });
  </script>
</body>
</html>
