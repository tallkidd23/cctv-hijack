<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCTV Billboard Hijack // Interactive Projection Map</title>
  <style>
    :root {
      --phosphor-cyan: #00f0ff;
      --phosphor-pink: #ff0055;
      --bg-dark: #07090d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: var(--bg-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', Courier, monospace;
      color: #9ab4c2;
      overflow-x: hidden;
      padding: 16px;
    }

    .cctv-stage {
      position: relative;
      width: 100%;
      max-width: 1050px;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.95), 0 0 0 2px #1c2630;
      cursor: pointer;
    }

    /* High-contrast Night City CCTV Backdrop Video/Canvas */
    #cctvBaseCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* 3D Billboard Quad */
    .billboard-3d-quad {
      position: absolute;
      top: 13%;
      left: 45%;
      width: 42%;
      height: 52%;
      z-index: 2;
      perspective: 800px;
      transform-style: preserve-3d;
      pointer-events: none;
    }

    .billboard-video-surface {
      width: 100%;
      height: 100%;
      transform: rotateY(-36deg) rotateX(10deg) skewY(-6deg) scale(0.96);
      transform-origin: left center;
      border: 3px solid #1c2a38;
      box-shadow: 
        0 0 40px rgba(0, 240, 255, 0.5),
        inset 0 0 25px rgba(0, 0, 0, 0.95);
      background: #05080c;
      overflow: hidden;
      position: relative;
    }

    .billboard-video-surface video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: contrast(1.15) saturate(1.25) brightness(1.1);
      z-index: 1;
    }

    .jumbotron-led-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle, rgba(0, 0, 0, 0) 60%, rgba(0, 0, 0, 0.65) 100%),
        repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.25) 0px, rgba(0, 0, 0, 0.25) 2px, transparent 2px, transparent 4px),
        repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.25) 0px, rgba(0, 0, 0, 0.25) 2px, transparent 2px, transparent 4px);
      background-size: 100% 100%, 4px 4px, 4px 4px;
      mix-blend-mode: multiply;
      pointer-events: none;
      z-index: 4;
    }

    .billboard-bloom {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(255,255,255,0.18) 0%, transparent 40%, rgba(0,240,255,0.15) 100%);
      mix-blend-mode: screen;
      pointer-events: none;
      z-index: 5;
    }

    .cctv-hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
      font-size: 11px;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 0 6px rgba(0,0,0,0.95);
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .rec-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: bold;
      color: #ff3b30;
    }
    .rec-dot {
      width: 8px;
      height: 8px;
      background: #ff3b30;
      border-radius: 50%;
      animation: blink 1.2s infinite;
      box-shadow: 0 0 8px #ff3b30;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

    .crosshair-target {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      border: 1px dashed rgba(255, 255, 255, 0.35);
      pointer-events: none;
      z-index: 10;
    }

    .hud-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .control-deck {
      margin-top: 18px;
      width: 100%;
      max-width: 1050px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: center;
      background: #0d1217;
      padding: 14px 20px;
      border-radius: 8px;
      border: 1px solid #1f2b37;
    }

    .sliders-grid {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }

    .slider-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 10px;
      color: #8da4b3;
    }

    .slider-item input {
      accent-color: var(--phosphor-cyan);
      cursor: pointer;
    }

    .deck-buttons {
      display: flex;
      gap: 10px;
    }

    .btn-action {
      background: #15222e;
      border: 1px solid var(--phosphor-cyan);
      color: var(--phosphor-cyan);
      font-family: inherit;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1.5px;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      background: var(--phosphor-cyan);
      color: #000;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
    }
  </style>
</head>
<body>

  <div class="cctv-stage" id="cctvStage" title="Click to start video with sound">
    <!-- Rich Animated Night City CCTV Canvas -->
    <canvas id="cctvBaseCanvas"></canvas>

    <!-- 3D Billboard Quad Surface -->
    <div class="billboard-3d-quad" id="billboardQuad">
      <div class="billboard-video-surface" id="billboardSurface">
        
        <video 
          id="hijackVideo" 
          playsinline 
          loop 
          muted 
          autoplay 
          preload="auto">
          <source src="paludarium_stream.mp4" type="video/mp4">
          <source src="https://paludarium.tallkidd.com/paludarium_stream.mp4" type="video/mp4">
        </video>

        <div class="jumbotron-led-grid"></div>
        <div class="billboard-bloom"></div>

      </div>
    </div>

    <div class="crosshair-target"></div>

    <div class="cctv-hud">
      <div class="hud-top">
        <div class="rec-indicator">
          <div class="rec-dot"></div>
          <span>LIVE CCTV [CAM-07] // TIMES SQ. NORTH</span>
        </div>
        <div id="timeHud">00:00:00 UTC</div>
      </div>

      <div class="hud-bottom">
        <div>
          LAT: 40.7580° N | LON: 73.9855° W<br>
          TARGET: JUMBOTRON AD-ARRAY #4
        </div>
        <div style="color: var(--phosphor-cyan);">
          HIJACK STATUS: <span style="font-weight:bold;" id="hijackStatusText">OVERLAY ACTIVE</span>
        </div>
      </div>
    </div>

  </div>

  <div class="control-deck">
    <div class="sliders-grid">
      <div class="slider-item">
        <span>YAW (Rotate Y): <strong id="valY">-36°</strong></span>
        <input type="range" id="rotY" min="-80" max="80" value="-36">
      </div>
      <div class="slider-item">
        <span>PITCH (Rotate X): <strong id="valX">10°</strong></span>
        <input type="range" id="rotX" min="-50" max="50" value="10">
      </div>
      <div class="slider-item">
        <span>SKEW (Vertical): <strong id="valSkew">-6°</strong></span>
        <input type="range" id="skewY" min="-30" max="30" value="-6">
      </div>
      <div class="slider-item">
        <span>SCALE: <strong id="valScale">0.96</strong></span>
        <input type="range" id="scaleVal" min="0.5" max="1.5" step="0.02" value="0.96">
      </div>
    </div>

    <div class="deck-buttons">
      <button class="btn-action" id="audioToggle">AUDIO: MUTED</button>
      <button class="btn-action" id="resetAngles">RESET</button>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('timeHud').innerText = 
        now.toISOString().replace('T', ' ').substring(0, 19) + ' EDT';
    }
    setInterval(updateClock, 1000);
    updateClock();

    const canvas = document.getElementById('cctvBaseCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }
    window.addEventListener('resize', resizeCanvas);
    // Initial size with fallback
    canvas.width = canvas.parentElement.clientWidth || 960;
    canvas.height = canvas.parentElement.clientHeight || 540;
    setTimeout(resizeCanvas, 200);

    // Cars on multi-lane avenue
    let traffic = Array.from({ length: 24 }, (_, i) => ({
      x: (i * 50) % 960,
      y: 0.72 + (i % 3) * 0.08,
      speed: (1.5 + (i % 3) * 1.2),
      color: i % 2 === 0 ? '#ff3b30' : '#ffe066',
      size: 4 + (i % 3) * 2
    }));

    function drawCityCCTV() {
      const w = canvas.width;
      const h = canvas.height;

      // Dark Sky
      const skyGrad = ctx.createLinearGradient(0, 0, 0, h);
      skyGrad.addColorStop(0, '#0a1018');
      skyGrad.addColorStop(1, '#020406');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, w, h);

      // Left High-Rise Tower
      ctx.fillStyle = '#0f1722';
      ctx.fillRect(w * 0.04, h * 0.15, w * 0.18, h * 0.65);
      ctx.fillStyle = '#090e15';
      ctx.fillRect(w * 0.04, h * 0.15, w * 0.04, h * 0.65);

      // Left Tower Windows
      for (let r = 0; r < 14; r++) {
        for (let c = 0; c < 4; c++) {
          if ((r + c * 2) % 3 !== 0) {
            ctx.fillStyle = ((r * 7 + c) % 5 === 0) ? '#ffcc00' : 'rgba(180, 230, 255, 0.45)';
            ctx.fillRect(w * 0.08 + c * (w * 0.032), h * 0.18 + r * (h * 0.038), w * 0.018, h * 0.022);
          }
        }
      }

      // Mid-Ground Building
      ctx.fillStyle = '#0d131b';
      ctx.fillRect(w * 0.25, h * 0.32, w * 0.18, h * 0.48);

      // Concrete Wall / Billboard Mounting Tower
      ctx.fillStyle = '#141c26';
      ctx.beginPath();
      ctx.moveTo(w * 0.43, h * 0.08);
      ctx.lineTo(w * 0.90, h * 0.12);
      ctx.lineTo(w * 0.90, h * 0.72);
      ctx.lineTo(w * 0.43, h * 0.68);
      ctx.fill();

      // Steel Trusses Supporting Billboard
      ctx.strokeStyle = '#223040';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(w * 0.43, h * 0.68);
      ctx.lineTo(w * 0.43, h * 0.76);
      ctx.moveTo(w * 0.90, h * 0.72);
      ctx.lineTo(w * 0.90, h * 0.78);
      ctx.stroke();

      // Street Asphalt & Sidewalk
      ctx.fillStyle = '#18202a';
      ctx.fillRect(0, h * 0.70, w, h * 0.03); // Sidewalk curb
      ctx.fillStyle = '#06090d';
      ctx.fillRect(0, h * 0.73, w, h * 0.27); // Street

      // Street center dashed yellow lane markings
      ctx.fillStyle = '#c9a44c';
      for (let x = 0; x < w; x += 40) {
        ctx.fillRect(x, h * 0.83, 20, 2);
      }

      // Streetlights and glow
      for (let l = 0; l < 4; l++) {
        const lx = w * 0.12 + l * (w * 0.26);
        ctx.fillStyle = '#222';
        ctx.fillRect(lx, h * 0.58, 3, h * 0.14);
        ctx.fillStyle = '#fff9d6';
        ctx.beginPath();
        ctx.arc(lx + 1, h * 0.58, 4, 0, Math.PI * 2);
        ctx.fill();

        // Light cone
        const lightGrad = ctx.createRadialGradient(lx, h * 0.58, 2, lx, h * 0.75, 40);
        lightGrad.addColorStop(0, 'rgba(255, 240, 180, 0.25)');
        lightGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = lightGrad;
        ctx.beginPath();
        ctx.arc(lx, h * 0.72, 35, 0, Math.PI * 2);
        ctx.fill();
      }

      // Moving Headlights and Taillights
      traffic.forEach(car => {
        car.x += car.speed;
        if (car.x > w + 20) car.x = -20;
        const cy = h * car.y;
        ctx.fillStyle = car.color;
        ctx.shadowColor = car.color;
        ctx.shadowBlur = 10;
        ctx.fillRect(car.x, cy, car.size * 2.2, car.size);
        ctx.shadowBlur = 0;
      });

      // Subtle CCTV Grain / Scanlines
      ctx.fillStyle = 'rgba(255, 255, 255, 0.02)';
      for (let k = 0; k < 4; k++) {
        const lineY = Math.random() * h;
        ctx.fillRect(0, lineY, w, 1.5);
      }

      requestAnimationFrame(drawCityCCTV);
    }
    drawCityCCTV();

    const video = document.getElementById('hijackVideo');
    const audioToggle = document.getElementById('audioToggle');
    const stage = document.getElementById('cctvStage');

    function startPlayback() {
      video.play().then(() => {
        document.getElementById('hijackStatusText').innerText = "STREAM ONLINE";
      }).catch(err => {
        console.log("Autoplay click required:", err);
      });
    }
    startPlayback();

    function toggleAudio() {
      video.muted = !video.muted;
      audioToggle.innerText = video.muted ? "AUDIO: MUTED" : "AUDIO: ON";
      audioToggle.style.background = video.muted ? "#15222e" : "var(--phosphor-cyan)";
      audioToggle.style.color = video.muted ? "var(--phosphor-cyan)" : "#000";
    }

    audioToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleAudio();
    });
    stage.addEventListener('click', () => {
      startPlayback();
      toggleAudio();
    });

    // Perspective Controls
    const surface = document.getElementById('billboardSurface');
    const rotY = document.getElementById('rotY');
    const rotX = document.getElementById('rotX');
    const skewY = document.getElementById('skewY');
    const scaleVal = document.getElementById('scaleVal');

    const valY = document.getElementById('valY');
    const valX = document.getElementById('valX');
    const valSkew = document.getElementById('valSkew');
    const valScale = document.getElementById('valScale');

    function updatePerspective() {
      valY.innerText = rotY.value + '°';
      valX.innerText = rotX.value + '°';
      valSkew.innerText = skewY.value + '°';
      valScale.innerText = scaleVal.value;

      surface.style.transform = `rotateY(${rotY.value}deg) rotateX(${rotX.value}deg) skewY(${skewY.value}deg) scale(${scaleVal.value})`;
    }

    rotY.addEventListener('input', updatePerspective);
    rotX.addEventListener('input', updatePerspective);
    skewY.addEventListener('input', updatePerspective);
    scaleVal.addEventListener('input', updatePerspective);

    document.getElementById('resetAngles').addEventListener('click', () => {
      rotY.value = -36;
      rotX.value = 10;
      skewY.value = -6;
      scaleVal.value = 0.96;
      updatePerspective();
    });
  </script>
</body>
</html>
